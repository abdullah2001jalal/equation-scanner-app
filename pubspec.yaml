name: equation_scanner
description: "ماسح المعادلات: استخراج النصوص والمعادلات الرياضية والكيميائية من الصور وملف PDF إلى ملف Word (docx) بمعادلات OMML حقيقية."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  pdfx: ^2.6.0
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  archive: ^3.6.1
  flutter_math_fork: ^0.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

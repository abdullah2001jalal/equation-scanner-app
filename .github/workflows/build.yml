name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (ملاحظات نمطية لا توقف البناء)
        run: flutter analyze
        continue-on-error: true

      - name: Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: نسخ مع اسم واضح
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/EquationScanner-${{ github.run_number }}.apk

      - name: رفع Artifact
        uses: actions/upload-artifact@v4
        with:
          name: equation-scanner-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: إنشاء Release (تنزيل مباشر بدون حساب)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: بناء رقم ${{ github.run_number }}
          files: |
            build/app/outputs/flutter-apk/*.apk
          body: |
            نسخة APK جديدة من "ماسح المعادلات".
            نزّل الملف EquationScanner-*.apk وثبّته على أندرويد (يتيح مصادر غير معروفة).
            أدخل مفتاح Gemini API من شاشة الإعدادات داخل التطبيق.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
